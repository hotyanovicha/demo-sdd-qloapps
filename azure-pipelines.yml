# Docker
# Pull a Docker image, Run app, Run Tests (BrowserStack reporting)
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger: none
pr: none

resources:
- repo: self

variables:
  - name: dockerRegistryServiceConnection
    value: 'ghcr-connection'
  - name: imageRepository
    value: 'hotyanovicha/demo-sdd-qloapps'
  - name: containerRegistry
    value: 'ghcr.io'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'
  - name: BASE_URL
    value: 'http://localhost:8080'

pool:
  name: main

stages:
- stage: Test
  displayName: Run Playwright Tests
  jobs:
  - job: Test
    displayName: BrowserStack Tests
    steps:
    - task: BrowserStackConfig@0
      displayName: 'BrowserStack Setup'
      inputs:
        BrowserStackServiceEndPoint: 'browserstack-connection'

    - script: |
        echo "Calculating commit SHA..."
        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        echo "Short SHA: $SHORT_SHA"
        echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
      displayName: 'Calculate Short SHA'

    - script: |
        echo "Logging into GHCR..."
        echo $(GHCR_PAT) | docker login ghcr.io -u $(GHCR_USERNAME) --password-stdin
      displayName: 'Login to GHCR'
      env:
        GHCR_PAT: $(GHCR_PAT)
        GHCR_USERNAME: $(GHCR_USERNAME)

    - script: |
        echo "Pulling Docker image..."
        IMAGE_TAG=sha-$(SHORT_SHA)
        echo "Trying to pull image with tag: $IMAGE_TAG"
        
        MAX_RETRIES=3
        COUNT=0
        SUCCESS=false
        
        while [ $COUNT -lt $MAX_RETRIES ]; do
          if docker pull ghcr.io/$(imageRepository):$IMAGE_TAG; then
            echo "Successfully pulled image with tag $IMAGE_TAG"
            echo "##vso[task.setvariable variable=IMAGE_TAG]$IMAGE_TAG"
            SUCCESS=true
            break
          else
            echo "Attempt $((COUNT+1)) failed to pull image with tag $IMAGE_TAG. Waiting 10s..."
            sleep 10
            COUNT=$((COUNT+1))
          fi
        done
        
        if [ "$SUCCESS" = false ]; then
          echo "Failed to pull image with tag $IMAGE_TAG after $MAX_RETRIES attempts, falling back to latest"
          docker pull ghcr.io/$(imageRepository):latest
          echo "##vso[task.setvariable variable=IMAGE_TAG]latest"
        fi
      displayName: 'Pull Docker Image'

    - script: |
        echo "Starting application with Docker Compose..."
        export APP_IMAGE=ghcr.io/$(imageRepository):$(IMAGE_TAG)
        echo "Using APP_IMAGE: $APP_IMAGE"
        docker compose up -d
        
        echo "Waiting for service to be healthy..."
        for i in {1..12}; do
          if docker compose ps | grep -q "(healthy)"; then
            echo "Service is healthy!"
            break
          fi
          echo "Waiting for health check... ($((i*5))s)"
          sleep 5
        done
        
        docker compose ps
      displayName: 'Start Application'
      env:
        APP_IMAGE: ghcr.io/$(imageRepository):$(IMAGE_TAG)

    - script: |
        echo "Clearing Smarty template cache..."
        docker exec qloapps_build_app sh -c "rm -rf /var/www/html/cache/smarty/compile/* /var/www/html/cache/smarty/cache/*"
        echo "Smarty cache cleared successfully"
      displayName: 'Clear Smarty Template Cache'

    - script: |
        npm install -g pnpm
        pnpm config set store-dir $(Agent.WorkFolder)/_pnpm_store
        pnpm install --frozen-lockfile
      displayName: 'Install dependencies (pnpm)'

    - script: |
        npx playwright install --with-deps chromium
      displayName: 'Install Playwright Browsers'
      env:
        PLAYWRIGHT_BROWSERS_PATH: $(Agent.WorkFolder)/_playwright_cache

    - script: |
        npx browserstack-node-sdk playwright test 2>&1 | tee bs_test_output.txt
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        exit $TEST_EXIT_CODE
      displayName: 'Run Playwright on BrowserStack'
      env:
        BASE_URL: $(BASE_URL)
        CI: 'true'
        BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
        BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
        BROWSERSTACK_PROJECT_NAME: 'Demo-Qol'
        BROWSERSTACK_BUILD_NAME: $(BROWSERSTACK_BUILD_NAME)
        BROWSERSTACK_RELEASE_TAG: 'release $(releaseName)'
        BROWSERSTACK_REGRESSION_TAG: 'Regression-$(Build.BuildNumber)'
        PLAYWRIGHT_BROWSERS_PATH: $(Agent.WorkFolder)/_playwright_cache

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results/results.xml'
        testRunTitle: 'BrowserStack Tests'
        failTaskOnFailedTests: true
      displayName: 'Publish Test Results'

    - script: |
        docker compose down
      condition: always()
      displayName: 'Teardown Docker'
